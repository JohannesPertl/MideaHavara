# Local configuration for the availability tracker.
#
# This checkout is configured for Graz, Austria and for local execution
# (for example from a Raspberry Pi systemd timer), not GitHub Actions.

products:
  - name: "Midea PortaSplit 12.000 BTU"
    # Confirmed EAN for the Midea/Comfee PortaSplit 12.000 BTU model.
    eans:
      - "4048164116478"
    # Fallback title match if a source does not expose an EAN.
    title_must_include:
      - "portasplit"
    title_must_exclude: []
    max_price: 1000.0
    allow_used: true
    urls:
      geizhals: "https://geizhals.at/midea-comfee-portasplit-v233573.html"
      mediamarkt: "https://www.mediamarkt.at/de/product/_midea-portasplit-mobile-klimaanlage-max-raumgrosse-42-m-eek-a-12000-btuh-weiss-2075674.html"
      obi: "https://www.obi.at/p/3586245/midea-mobile-split-klimaanlage-portasplit"
      bauhaus: "https://www.bauhaus.at/p/31934233"
      # Keep the remaining URLs documented but disabled below. Enable only after
      # checking that the page still exposes reliable product data.
      idealo: ""
      saturn: ""
      hornbach: ""
      amazon: "https://www.amazon.de/dp/B0D3PP64JS"
      greensun: "https://www.greensun-germany.com/MIDEA-PortaSplit-35-kW-Mobile-Split-Klimaanlage-Kuehlen-Heizen-ohne-feste-Installation"

location:
  postal_code: "8010"
  city: "Graz"
  latitude: 47.0707
  longitude: 15.4395
  radius_km: 25

# Source switches. Disabled sources are skipped even when a URL is present.
sources:
  geizhals: true
  mediamarkt: true
  obi: true
  bauhaus: true
  idealo: false
  saturn: false
  hornbach: false
  amazon: false
  greensun: false

# Daily status message plus at-most-daily total-outage alert via Telegram.
# 6 UTC is 08:00 in Austria during daylight saving time.
heartbeat:
  enabled: true
  hour_utc: 6
